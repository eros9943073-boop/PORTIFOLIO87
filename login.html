
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Área Administrativa</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f8f9f6;
  font-family: Georgia, serif;
  color: #173f32;
}

header {
  position: absolute;
  top: 25px;
  left: 30px;
}

.login-card {
  width: 380px;
  max-width: calc(100% - 40px);
  padding: 35px;
  background: white;
  border: 2px solid #c9a34e;
  border-radius: 18px;
  box-shadow: 10px 10px 0 #173f32;
}

.login-card h1 { color: #173f32; }

.login-card input {
  width: 100%;
  padding: 11px;
  margin: 8px 0 18px;
  border: 1px solid #c9a34e;
  border-radius: 7px;
  outline-color: #173f32;
}

.login-card button {
  width: 100%;
  padding: 12px;
  background: #173f32;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.login-card button:hover {
  background: #c9a34e;
}

.login-card a { color: #b38b3e; }

#mensagem-erro {
  color: #b33a3a;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Voltar para o portfólio</a>
</header>

<main class="login-card">

  <h1>Acesso Restrito</h1>
  <p>Entre com seu usuário e senha para gerenciar o portfólio.</p>

  <form id="form-login">

    <div>
      <label for="usuario">Usuário:</label>
      <input type="text" id="usuario" name="usuario" required>
    </div>

    <div>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>
    </div>

    <button type="submit">Entrar →</button>

  </form>

  <p id="mensagem-erro"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://yatsmsvttvldmupcatjd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wfdIRdpeCGp0bRpjSFr8mw_f1EwGQZz';

const bancoDados = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const formulario = document.getElementById('form-login');
const mensagemErro = document.getElementById('mensagem-erro');

formulario.addEventListener('submit', async function(evento) {
  evento.preventDefault();

  const usuarioDigitado = document.getElementById('usuario').value.trim();
  const senhaDigitada = document.getElementById('senha').value;

  mensagemErro.textContent = "Consultando banco de dados...";

  const { data, error } = await bancoDados
    .from('usuarios')
    .select('*')
    .eq('usuario', usuarioDigitado)
    .eq('senha', senhaDigitada)
    .maybeSingle();

  if (error) {
    console.error("Erro técnico do Supabase:", error);
    mensagemErro.textContent = "Erro ao conectar com o banco. Verifique o console (F12).";
    return;
  }

  if (data) {
    localStorage.setItem('usuarioLogado', 'true');
    localStorage.setItem('nomeUsuario', data.usuario);

    window.location.href = "dashboard.html";
  } else {
    mensagemErro.textContent = "Usuário ou senha incorretos.";
  }
});
</script>

</body>
</html>
